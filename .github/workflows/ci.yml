name: CI

# Runs on main only (free-tier minutes); validate PRs locally with `act`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check --output-format=github . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy src
      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with: { dockerfile: Dockerfile }
      - name: lat.md knowledge graph
        run: npx -y lat.md@0.13.3 check

  test:
    name: Unit & app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: uv run pytest --junitxml=junit.xml --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml

  security:
    name: SAST, SCA & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --locked
      - name: bandit (SAST)
        run: uv run bandit -r src -c pyproject.toml
      - name: pip-audit (dependency CVEs)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > requirements.txt
          uv run pip-audit -r requirements.txt --strict --progress-spinner off
      - name: gitleaks (secrets)
        if: ${{ !env.ACT }}   # needs a real push payload; locally: pre-commit run gitleaks --all-files
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: checkov (Dockerfile & IaC misconfig)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,terraform,github_actions
          soft_fail: true
          quiet: true
      - name: "[placeholder] SonarQube quality gate"
        run: |
          echo "::notice title=SonarQube::MOCK - would run sonar-scanner against SONAR_HOST_URL with SONAR_TOKEN"
          echo "Quality gate: PASSED (mock) - coverage, duplication, code smells"
      - name: "[placeholder] Snyk"
        run: echo "::notice title=Snyk::MOCK - would run 'snyk test' + 'snyk code test' with SNYK_TOKEN"
      - name: "[placeholder] License compliance"
        run: echo "::notice title=Licenses::MOCK - would run pip-licenses / FOSSA against an allow-list"

  infra:
    name: Terraform & Terragrunt validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_wrapper: false }
      - name: Install Terragrunt
        run: |
          curl -sSL -o /usr/local/bin/terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/v1.2.2/terragrunt_linux_amd64
          chmod +x /usr/local/bin/terragrunt
      - name: terraform fmt / validate (module)
        working-directory: infra/modules/streamlit-app
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: terragrunt hcl fmt
        working-directory: infra/live
        run: terragrunt hcl fmt --check
      - name: "[placeholder] tflint"
        run: echo "::notice title=tflint::MOCK - would run tflint --recursive with the kubernetes ruleset"
      - name: "[placeholder] Infracost"
        run: echo "::notice title=Infracost::MOCK - would post a cost diff for the prod EKS stack on PRs"

  image:
    name: Build, scan & publish image
    needs: [lint, test, security, infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name app -p 8501:8501 "${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          for _ in $(seq 1 30); do curl -sf localhost:8501/_stcore/health && exit 0; sleep 2; done
          docker logs app; exit 1
      - name: Trivy image scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, SHA-pinned (tag-repointing incident Mar 2026)
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Upload Trivy SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true  # code scanning needs GHAS on private repos
        with: { sarif_file: trivy.sarif }
      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: docker push --all-tags ${{ env.IMAGE }}
      - name: "[placeholder] cosign sign + attest SBOM"
        run: |
          echo "::notice title=cosign::MOCK - would run: cosign sign --yes ${{ env.IMAGE }}@<digest> (keyless, GitHub OIDC)"
          echo "MOCK - would run: cosign attest --predicate sbom.spdx.json --type spdxjson ${{ env.IMAGE }}@<digest>"
